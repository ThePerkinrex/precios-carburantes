<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script src="/files/js/lang.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#15233a">
	<title>Carburantes</title>
	<link rel="icon" href="/files/images/favicon.svg" type="image/svg+xml">
	<link rel="icon" href="/files/images/favicon.ico" sizes="32x32">
	<link rel="apple-touch-icon" href="/files/images/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
	<link rel="stylesheet" href="/files/css/app.css">
</head>
<body>
	<div class="page">
		<header class="page-head">
			<h1>Carburantes</h1>
			<p id="greeting"></p>
		</header>

		<p id="expiryBanner" class="banner" hidden></p>

		<div class="home">
			<section id="board" class="board" aria-live="polite">
				<div class="board-head"><span>Average price</span><strong>Spain</strong></div>
				<p class="board-empty">Loading prices…</p>
			</section>

			<nav class="home-links">
				<a class="primary-link" href="/files/map">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
					Open the map
				</a>
				<ul id="links" class="links"></ul>
			</nav>
		</div>
	</div>

	<script type="module">
		import { getUserState } from "/files/js/api.js";
		import { expiryWarning } from "/files/js/certs_ui.js";
		import { t } from "/files/js/i18n.js";
		import { pagesFor } from "/files/js/nav.js";
		import { getPriceHistory, renderBoard } from "/files/js/price_board.js";

		const board = document.getElementById("board");
		// The board compares with a week ago, so a little over a week is enough.
		getPriceHistory({ from: new Date(Date.now() - 8 * 24 * 60 * 60 * 1000) })
			.then((history) => renderBoard(board, history, t("Spain")))
			.catch((e) => {
				board.querySelector(".board-empty").textContent = e.message;
			});

		const state = await getUserState();
		document.getElementById("greeting").textContent = t("Signed in as {name}", { name: state.display_name || state.username });

		document.getElementById("links").replaceChildren(
			...pagesFor(state)
				.filter((page) => page.id !== "map")
				.map((page) => {
					const li = document.createElement("li");
					li.innerHTML = `<a><span class="title"></span><span class="hint"></span></a>`;
					li.querySelector("a").href = page.href;
					li.querySelector(".title").textContent = page.label;
					li.querySelector(".hint").textContent = page.hint;
					return li;
				}),
		);

		const warning = state.cert && expiryWarning(state.cert.not_after);
		if (warning) {
			const banner = document.getElementById("expiryBanner");
			const link = Object.assign(document.createElement("a"), { href: "/files/account", textContent: t("Renew it") });
			banner.append(`${warning} `, link, ".");
			banner.hidden = false;
		}
	</script>
</body>
</html>
