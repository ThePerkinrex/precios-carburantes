<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script src="/files/js/lang.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#15233a">
	<title>Settings</title>
	<link rel="icon" href="/files/images/favicon.svg" type="image/svg+xml">
	<link rel="icon" href="/files/images/favicon.ico" sizes="32x32">
	<link rel="apple-touch-icon" href="/files/images/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
	<link rel="stylesheet" href="/files/css/app.css">
	<link rel="stylesheet" href="/files/css/account.css">
</head>
<body>
	<div class="page">
		<nav id="nav" class="nav" aria-label="Pages">
			<a href="/files/map">Map</a>
			<a href="/files/settings" aria-current="page">Settings</a>
		</nav>
		<header class="page-head">
			<h1>Settings</h1>
		</header>

		<section class="card">
			<h2>Language</h2>
			<p class="muted">Applies on every device you use.</p>
			<fieldset id="language" class="choices">
				<legend class="visually-hidden">Language</legend>
				<label class="check"><input type="radio" name="language" value=""> Same as the browser</label>
				<!-- Each language in itself, so it can be found whatever the page is in. -->
				<label class="check"><input type="radio" name="language" value="es" lang="es"> Español</label>
				<label class="check"><input type="radio" name="language" value="en" lang="en"> English</label>
			</fieldset>
			<p id="languageMessage" class="muted"></p>
		</section>

		<section class="card">
			<h2>My car</h2>
			<p class="muted">The route planner uses it to work out where to fill up.</p>
			<form id="carForm" class="inline">
				<fieldset class="choices">
					<legend>Fuel</legend>
					<label class="check"><input type="radio" name="fuel" value="diesel"> Diesel</label>
					<label class="check"><input type="radio" name="fuel" value="gasolina"> Petrol</label>
				</fieldset>
				<label>Consumption (L/100km)
					<input type="number" name="consumption" min="0.1" step="0.1" inputmode="decimal">
				</label>
				<label>Tank (L)
					<input type="number" name="tank_size" min="1" step="1" inputmode="numeric">
				</label>
				<fieldset class="range">
					<legend>Fill up when there's between</legend>
					<label>Minimum (L)
						<input type="number" name="stop_min" min="0" step="1" inputmode="numeric">
					</label>
					<label>Maximum (L)
						<input type="number" name="stop_max" min="0" step="1" inputmode="numeric">
					</label>
					<p class="muted">It never drops below the minimum, not even on arrival.</p>
				</fieldset>
				<button type="submit">Save</button>
			</form>
			<p id="carMessage"></p>
		</section>
	</div>
	<script type="module" src="/files/js/settings.js"></script>
</body>
</html>
