<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#15233a">
    <!-- The token is in this page's URL: don't pass it on to other sites. -->
    <meta name="referrer" content="no-referrer">
    <title>Shared trip</title>
    <link rel="icon" href="/files/images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/files/images/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/files/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
    <link rel="stylesheet" href="/files/css/app.css">
    <link rel="stylesheet" href="/files/css/account.css">
</head>
<body>
    <div class="page">
        <nav id="nav" class="nav" aria-label="Pages">
            <a href="/files/map">Map</a>
            <a href="/files/trips">My trips</a>
        </nav>
        <header class="page-head">
            <h1>Shared trip</h1>
        </header>
        <section class="card">
            <p id="message" class="muted">Opening the trip…</p>
        </section>
    </div>
    <script type="module">
        import { claimTripShare, getUserState, routePageUrl } from "/files/js/api.js";
        import { renderNav } from "/files/js/nav.js";

        getUserState().then((state) => renderNav(document.getElementById("nav"), state, null));

        // Claimed with a POST from here, not when the page is fetched, so
        // link previews can't use the link up.
        const token = location.pathname.split("/").pop();
        try {
            const { trip_id, hash, route_idx } = await claimTripShare(token);
            location.replace(routePageUrl(hash, route_idx, trip_id));
        } catch (e) {
            const message = document.getElementById("message");
            message.textContent = e.status === 404
                ? "This link is invalid, has expired, or was already opened by someone else. Share links only work for one person: ask for a new one."
                : `Couldn't open the trip: ${e.message}`;
            message.className = "error";
        }
    </script>
</body>
</html>
