# /etc/nginx/conf.d/carburantes.conf
#
# mTLS in front of the service. Every request needs a client cert that
# verifies against the CA and the CRL, except /enroll/ (one-time invite
# links, which is how people without a cert get one). The service re-checks
# the cert serial on every request, and listens on localhost only.

limit_req_zone $binary_remote_addr zone=carburantes_enroll:1m rate=10r/m;

server {
    server_name carburantes.theperkinrex.duckdns.org;

    ssl_client_certificate /mnt/usb/carburantes/certs/CA/ca-cert.pem;
    ssl_crl                /mnt/usb/carburantes/certs/CA/crl.pem;
    # "optional" so /enroll/ is reachable without a cert; everything else is
    # gated on $ssl_client_verify below.
    ssl_verify_client optional;

    # Always set (overwriting anything the client sent).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify; # SUCCESS, NONE or FAILED:reason
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
    proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;

    # The only surface reachable without a client cert: invite redemption.
    location ^~ /enroll/ {
        limit_req zone=carburantes_enroll burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://127.0.0.1:8001;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/carburantes.theperkinrex.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/carburantes.theperkinrex.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = carburantes.theperkinrex.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name carburantes.theperkinrex.duckdns.org;
    return 404; # managed by Certbot
}
